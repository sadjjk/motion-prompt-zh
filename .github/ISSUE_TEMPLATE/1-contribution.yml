name: "提交名称或分类包"
description: "提议或贡献你所在领域的名称、分类包，或更正已有名称"
labels: ["contribution"]
body:
  - type: markdown
    attributes:
      value: |
        感谢参与。名称与示例的标准见 [CONTRIBUTING.md](https://github.com/sadjjk/motion-prompt-zh/blob/main/CONTRIBUTING.md)。已有文件也可以直接提交 Pull Request。

        本仓库采用 MIT 许可证，无法以 MIT 公开的内容不能接收。
  - type: dropdown
    id: kind
    attributes:
      label: "提交类型"
      options:
        - "新领域的分类包"
        - "为已有分类包增加语言"
        - "新增或更正名称"
        - "其他"
    validations:
      required: true
  - type: input
    id: field
    attributes:
      label: "领域与语言"
      placeholder: "例：灯光 · 简体中文"
    validations:
      required: true
  - type: textarea
    id: names
    attributes:
      label: "名称列表或内容说明"
      description: "每个名称附一句含义会很有帮助；不确定的名称请标注。"
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: "出处"
      description: "教材、软件手册、行业术语表、知名教程或你的从业经验等，每个名称一行即可。"
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: "文件或示例位置（如有）"
      description: "Pull Request、fork 或链接。若同一素材也发布在你的 X 帖子中，请一并附上帖子链接。"
  - type: checkboxes
    id: rights
    attributes:
      label: "确认"
      options:
        - label: "内容由我本人制作（或已获权利人公开许可，并在上方说明）。"
          required: true
        - label: "不包含他人的图片、视频、字体、标志或出镜人物（如包含，已在上方说明许可）。"
          required: true
        - label: "同意以 MIT 许可证公开。"
          required: true
        - label: "了解公开后许可证无法撤回。"
          required: true
